# LiteLLM 프록시 설정(ADR-0015). 파이프라인은 model_name(llm·vlm·embedding)만 부르므로 모델 전환은 이 파일만 고친다.
# 예비 모델은 두지 않는다. 개발 PC(메모리 16GB, CPU만)에서 로컬 LLM·VLM이 15분 안에 답하지 못했다(ADR-0015 바뀐 것).
# 로컬 모델은 운영체제·기종을 가리지 않도록 Ollama 전용 공급자 대신 OpenAI 호환 API(openai/…)로 부른다.
# 임베딩은 Groq에 임베딩 API가 없어 늘 로컬에서 돈다.

model_list:
  - model_name: llm
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
  - model_name: vlm
    litellm_params:
      model: groq/qwen/qwen3.8-27b
      api_key: os.environ/GROQ_API_KEY

  - model_name: embedding
    litellm_params:
      model: openai/embeddinggemma
      api_base: os.environ/EMBEDDING_MODEL_URL
      # Ollama는 키를 보지 않지만 OpenAI 호환 호출에는 값이 있어야 한다. 로컬 모델의 표지로도 쓴다(docker/tests)
      api_key: local

router_settings:
  # Groq가 이 시간(초) 안에 답하지 않으면 실패로 돌려준다
  timeout: 120
  # 속도 제한(429)만 Groq가 알려 준 대기 시간(60초 이하)을 기다려 다시 묻는다. 무료 등급 VLM은 분당 입력 7천 토큰이라
  # 모음 그림 요청(약 2,750토큰)을 1분에 세 번 물으면 걸린다(티켓 26 6절). 다른 오류는 다시 묻지 않고 실패로 돌려준다.
  # 다시 물으면 응답하지 않는 Groq를 제한 시간만큼 한 번 더 기다린다. 최종 확인 도구는 실패를 끊긴 실행으로 남겨 다시 돌리게 한다.
  # num_retries가 0이면 LiteLLM이 retry_policy를 보지 않아, 0이 아닌 값으로 두고 횟수는 retry_policy로 정한다.
  num_retries: 3
  retry_policy:
    DefaultRetries: 0
    RateLimitErrorRetries: 3

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
