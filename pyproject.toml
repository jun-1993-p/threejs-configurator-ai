[project]
name = "threejs-configurator-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "jsonschema",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# 서버만 설치한다. 애드인은 Fusion이 폴더에서 직접 불러온다.
include = ["server*"]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "mypy",
    "types-jsonschema",
    "pyyaml",
    "types-PyYAML",
    # 커밋 전 검사가 셸 스크립트(위저드, .githooks)를 검사한다. bash -n은 따옴표가 깨진 인라인 코드를 못 잡는다.
    "shellcheck-py",
]

[tool.pytest.ini_options]
testpaths = ["addin/tests", "server/tests", "synthetic/tests", "docker/tests", "scripts/tests"]
pythonpath = ["addin/ConfiguratorUploader", "."]
# 작업 중에는 -m "not solidcraft"로 몇 초 안에 돌리고, 전체(약 3분)는 커밋 전 검사가 돌린다
markers = ["solidcraft: 실제 solidcraft-cli로 합성 녹화본을 다시 만드는 느린 시험"]
addopts = "--strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "addin/ConfiguratorUploader"
# 인자 없이 `mypy`로 돌린다(커밋 전 검사도 그렇게 부른다)
files = ["addin/ConfiguratorUploader/uploader", "addin/tests", "synthetic", "server", "scripts", "docker/tests"]
exclude = ["addin/ConfiguratorUploader/ConfiguratorUploader\\.py", "addin/ConfiguratorUploader/uploader/fusion_model\\.py"]
