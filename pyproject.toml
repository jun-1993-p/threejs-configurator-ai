[project]
name = "threejs-configurator-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "jsonschema",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# 서버만 설치한다. 애드인은 Fusion이 폴더에서 직접 불러온다.
include = ["server*"]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "mypy",
    "types-jsonschema",
]

[tool.pytest.ini_options]
testpaths = ["addin/tests", "server/tests"]
pythonpath = ["addin/ConfiguratorUploader", "."]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "addin/ConfiguratorUploader"
exclude = ["addin/ConfiguratorUploader/ConfiguratorUploader\\.py", "addin/ConfiguratorUploader/uploader/fusion_model\\.py"]
